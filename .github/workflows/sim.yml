name: sim

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  sim-units:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: [s1s2, s3s4, fp-unit, fp-top, s5-int, s6-int, crv-smoke]
    name: sim-${{ matrix.group }}

    steps:
      - uses: actions/checkout@v4
        with:
          # crv-smoke needs riscv-arch-test/config/kronos/.../sail.json (submodule).
          # Other matrix entries don't, but the extra clone is cheap.
          submodules: ${{ matrix.group == 'crv-smoke' && 'recursive' || '' }}

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Install Sail (for crv-smoke only)
        if: matrix.group == 'crv-smoke'
        run: |
          sudo mkdir -p /usr/local
          curl --location https://github.com/riscv/sail-riscv/releases/download/0.10/sail-riscv-$(uname)-$(arch).tar.gz \
            | sudo tar xz --directory=/usr/local --strip-components=1
          sudo tee /usr/local/bin/sail_riscv_sim_timeout > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec timeout 60 sail_riscv_sim "$@"
          EOF
          sudo chmod +x /usr/local/bin/sail_riscv_sim_timeout

      - name: Run sim-${{ matrix.group }}
        run: |
          mkdir -p sim/obj_dir
          make -C sim -j$(nproc) sim-group-${{ matrix.group }} PULP_AXI_ROOT=/tmp/pulp_axi

  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pytest
        run: pip install pytest pyyaml
      - name: Run unit tests
        run: PYTHONPATH=. pytest tools/crv/tests/ tools/tests/ tools/trace/tests/ -v

  # Verilator lint with UNOPTFLAT enabled.  Catches RTL combinational loops
  # at the lint stage rather than at Vivado synth time (closes the detection
  # gap that allowed #89 to slip through to KV260 bitgen).  See sim/Makefile
  # `lint-rtl-s*` and tracking issue #90.
  lint-rtl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [s0, s1, s2, s3, s4, s5, s6]
    name: lint-rtl-${{ matrix.stage }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run lint-rtl-${{ matrix.stage }}
        run: make -C sim lint-rtl-${{ matrix.stage }} PULP_AXI_ROOT=/tmp/pulp_axi

  sim-all:
    runs-on: ubuntu-latest
    needs: [sim-units, pytest, lint-rtl]
    if: always()
    steps:
      - run: |
          if [ "${{ needs.sim-units.result }}" != "success" ] || \
             [ "${{ needs.pytest.result }}"    != "success" ] || \
             [ "${{ needs['lint-rtl'].result }}" != "success" ]; then
            echo "sim-units=${{ needs.sim-units.result }}"
            echo "pytest=${{ needs.pytest.result }}"
            echo "lint-rtl=${{ needs['lint-rtl'].result }}"
            exit 1
          fi

  compliance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [s1, s2, s3, s4, s5, s6]
    timeout-minutes: 60
    name: compliance-${{ matrix.stage }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          curl --location https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2025.07.16/riscv64-elf-ubuntu-22.04-gcc-nightly-2025.07.16-nightly.tar.xz \
            | sudo tar xJ --directory=/usr/local --strip-components=1

      - name: Install sail-riscv reference model
        run: |
          sudo mkdir -p /usr/local
          curl --location https://github.com/riscv/sail-riscv/releases/download/0.10/sail-riscv-$(uname)-$(arch).tar.gz \
            | sudo tar xz --directory=/usr/local --strip-components=1
          # kronos test configs reference sail_riscv_sim_timeout — install the
          # same wrapper the local tool provides (60s wall-clock limit).
          sudo tee /usr/local/bin/sail_riscv_sim_timeout > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec timeout 60 sail_riscv_sim "$@"
          EOF
          sudo chmod +x /usr/local/bin/sail_riscv_sim_timeout

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run compliance for ${{ matrix.stage }}
        run: make -C sim sim-arch-test-${{ matrix.stage }} PULP_AXI_ROOT=/tmp/pulp_axi

      - name: Upload compliance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-${{ matrix.stage }}-logs
          path: riscv-arch-test/work/*/logs
          if-no-files-found: ignore

  sim-diff:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage: [s5]
    timeout-minutes: 30
    name: sim-diff-${{ matrix.stage }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Install sail-riscv reference model
        run: |
          sudo mkdir -p /usr/local
          curl --location https://github.com/riscv/sail-riscv/releases/download/0.10/sail-riscv-$(uname)-$(arch).tar.gz \
            | sudo tar xz --directory=/usr/local --strip-components=1

      - name: Install Python test deps
        run: pip install pytest

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Unit-test trace_diff
        run: pytest tools/tests/test_trace_diff.py -v

      - name: Run sim-diff-all for ${{ matrix.stage }}
        run: make -C sim sim-diff-all PULP_AXI_ROOT=/tmp/pulp_axi

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-diff-${{ matrix.stage }}-traces
          path: sim/obj_dir/trace/
          if-no-files-found: ignore

  sim-s5-asm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: sim-s5-asm

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      # Runs every test under sw/stage5/ on the stage-5 sim binary, including
      # Stage 5h additions (test_perf_event_taxonomy, test_sdtrig).
      - name: Run sim-s5
        run: make -C sim sim-s5 PULP_AXI_ROOT=/tmp/pulp_axi

  sim-s6-asm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: sim-s6-asm

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      # Runs every test under sw/stage6/ on the stage-6 sim binary.
      - name: Run sim-s6
        run: make -C sim sim-s6 PULP_AXI_ROOT=/tmp/pulp_axi

  sim-s6b-asm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: sim-s6b-asm

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      # Runs every test under sw/stage6b/ on the stage-6b sim binary.
      - name: Run sim-s6b
        run: make -C sim sim-s6b PULP_AXI_ROOT=/tmp/pulp_axi

  perf-baseline-s6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: perf-baseline-s6

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run perf-baseline-s6
        run: make -C sim sim-perf-baseline-s6 PULP_AXI_ROOT=/tmp/pulp_axi

  compliance-cycle-diff-s7b:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: compliance-cycle-diff-s7b

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need ef7378e (stage7a baseline) in history
          submodules: recursive

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Build dhrystone hex
        run: make -C sw/perf/dhrystone all

      - name: Cycle-diff vs stage7a baseline (ef7378e), budget +5%
        env:
          PULP_AXI_ROOT: /tmp/pulp_axi
        run: |
          python3 tools/cycle_diff.py \
            --baseline-commit ef7378e \
            --prog sw/perf/dhrystone/build/dhrystone.hex \
            --max-delta 0.05 \
            --ignore-x10

  compliance-cycle-diff-s7c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: compliance-cycle-diff-s7c

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # need a4a25f9 (stage7e.0 baseline) in history
          submodules: recursive

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Build dhrystone hex
        run: make -C sw/perf/dhrystone all

      - name: Cycle-diff vs stage7e.0 baseline (a4a25f9), budget +22% (s7e.1 absorbs +1 load-use bubble + +1 PTW kickoff cost on top of MEM1B's +1 from 7d-closeout)
        env:
          PULP_AXI_ROOT: /tmp/pulp_axi
        run: |
          python3 tools/cycle_diff.py \
            --baseline-commit a4a25f9 \
            --prog sw/perf/dhrystone/build/dhrystone.hex \
            --max-delta 0.22 \
            --ignore-x10

  dcache-stress-s6:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: dcache-stress-s6

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run dcache-stress-s6
        run: |
          mkdir -p sim/obj_dir
          make -C sim sim-dcache-s6-stress PULP_AXI_ROOT=/tmp/pulp_axi

  crv-smoke-s6:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: crv-smoke-s6

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Install Sail
        run: |
          sudo mkdir -p /usr/local
          curl --location https://github.com/riscv/sail-riscv/releases/download/0.10/sail-riscv-$(uname)-$(arch).tar.gz \
            | sudo tar xz --directory=/usr/local --strip-components=1
          sudo tee /usr/local/bin/sail_riscv_sim_timeout > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec timeout 60 sail_riscv_sim "$@"
          EOF
          sudo chmod +x /usr/local/bin/sail_riscv_sim_timeout

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run crv-smoke-s6
        run: |
          mkdir -p sim/obj_dir
          make -C sim sim-crv-smoke-s6 PULP_AXI_ROOT=/tmp/pulp_axi

  cosim-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: cosim-smoke

    steps:
      - uses: actions/checkout@v4
        with:
          # Sail config lives under riscv-arch-test/config/kronos/... — same
          # reason crv-smoke-s6 needs the submodule. Without it, Sail crashes
          # silently and trace_diff sees an empty Sail trace.
          submodules: recursive

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Install Sail
        run: |
          sudo mkdir -p /usr/local
          curl --location https://github.com/riscv/sail-riscv/releases/download/0.10/sail-riscv-$(uname)-$(arch).tar.gz \
            | sudo tar xz --directory=/usr/local --strip-components=1
          sudo tee /usr/local/bin/sail_riscv_sim_timeout > /dev/null <<'EOF'
          #!/usr/bin/env bash
          exec timeout 60 sail_riscv_sim "$@"
          EOF
          sudo chmod +x /usr/local/bin/sail_riscv_sim_timeout

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run cosim-smoke
        run: |
          mkdir -p sim/obj_dir
          make -C sim sim-cosim-smoke PULP_AXI_ROOT=/tmp/pulp_axi

  sim-diff-traced:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: sim-diff-s5-traced

    steps:
      - uses: actions/checkout@v4

      - name: Install Verilator 5.046
        uses: ./.github/actions/setup-verilator

      - name: Install RISC-V GCC toolchain
        run: |
          sudo apt-get install -y gcc-riscv64-unknown-elf

      - name: Clone PULP AXI
        run: git clone --depth=1 https://github.com/vladdum/axi /tmp/pulp_axi

      - name: Run sim-diff-s5-traced
        run: make -C sim sim-diff-s5-traced PULP_AXI_ROOT=/tmp/pulp_axi

      - name: Upload trace artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-csvs
          path: sim/obj_dir/trace/*.csv
          if-no-files-found: error
