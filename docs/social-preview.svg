<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.85" fill="#0d1928"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 7" markerWidth="10" markerHeight="7"
            refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#00f0be"/>
    </marker>
    <filter id="tglow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boxglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="gleft" cx="0" cy="0.5" r="0.6" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#00f0be" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#00f0be" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#070c16"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#gleft)"/>

  <!-- Panel divider -->
  <line x1="558" y1="0" x2="558" y2="570" stroke="#0d1928" stroke-width="1.5"/>

  <!-- ══════════════════════════════════════════
       LEFT PANEL
       ══════════════════════════════════════════ -->

  <!-- Comment tag -->
  <text x="72" y="175"
        font-family="'Courier New','Lucida Console',monospace"
        font-size="13" letter-spacing="3" fill="#00f0be" opacity="0.4">// RISC-V CPU CORE</text>

  <!-- "kronos" hero text -->
  <text x="63" y="290"
        font-family="'Courier New','Lucida Console',monospace"
        font-size="120" font-weight="700" letter-spacing="-5"
        fill="#00f0be" filter="url(#tglow)">kronos</text>

  <!-- "—riscv" -->
  <text x="68" y="372"
        font-family="'Courier New','Lucida Console',monospace"
        font-size="80" font-weight="700"
        fill="#c4d6ea">—riscv</text>

  <!-- Horizontal rule -->
  <line x1="68" y1="404" x2="492" y2="404" stroke="#00f0be" stroke-width="0.75" opacity="0.18"/>

  <!-- ISA / language line -->
  <text x="68" y="430"
        font-family="'Courier New',monospace"
        font-size="14" letter-spacing="2" fill="#2d4a65">RV64IMAFDС · SYSTEMVERILOG</text>

  <!-- Badges -->
  <!-- ACT4 (teal border) -->
  <rect x="68" y="452" width="148" height="30" rx="3"
        fill="#050e1a" stroke="#00f0be" stroke-width="1"/>
  <text x="142" y="472"
        font-family="'Courier New',monospace"
        font-size="12" fill="#00f0be" text-anchor="middle">ACT4  895 / 895</text>

  <!-- 200 MHz -->
  <rect x="228" y="452" width="144" height="30" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="300" y="472"
        font-family="'Courier New',monospace"
        font-size="12" fill="#5a7a98" text-anchor="middle">KV260 · XCK26</text>

  <!-- Apache 2.0 -->
  <rect x="384" y="452" width="106" height="30" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="437" y="472"
        font-family="'Courier New',monospace"
        font-size="12" fill="#5a7a98" text-anchor="middle">Apache 2.0</text>

  <!-- Description -->
  <text x="68" y="522"
        font-family="'Courier New',monospace"
        font-size="13" fill="#2d4a65">Staged progression: single-cycle to</text>
  <text x="68" y="544"
        font-family="'Courier New',monospace"
        font-size="13" fill="#2d4a65">BOOM-style out-of-order (stage 8).</text>

  <!-- ══════════════════════════════════════════
       RIGHT PANEL
       ══════════════════════════════════════════ -->

  <!-- Section label -->
  <text x="919" y="106"
        font-family="'Courier New',monospace"
        font-size="11" letter-spacing="5" fill="#00f0be" text-anchor="middle" opacity="0.35">PIPELINE</text>

  <!-- 9-stage pipeline (stage 7e machine)
       Box: 51×46, gap: 10px
       Total: 9×51 + 8×10 = 539px
       Right-panel center: (558+1280)/2 = 919. Row center ~919.5 -->

  <!-- IF (active — teal stroke + glow) -->
  <rect x="650" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#00f0be" stroke-width="1.5" filter="url(#boxglow)"/>
  <text x="675.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#00f0be" text-anchor="middle">IF</text>

  <line x1="702" y1="151" x2="710" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ID -->
  <rect x="711" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1.5"/>
  <text x="736.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">ID</text>

  <line x1="763" y1="151" x2="771" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- RR -->
  <rect x="772" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1.5"/>
  <text x="797.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">RR</text>

  <line x1="824" y1="151" x2="832" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- EX1 -->
  <rect x="833" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1.5"/>
  <text x="858.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">EX1</text>

  <line x1="885" y1="151" x2="893" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- EX2 -->
  <rect x="894" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1.5"/>
  <text x="919.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">EX2</text>

  <line x1="946" y1="151" x2="954" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MEM1 -->
  <rect x="955" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1.5"/>
  <text x="980.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">MEM1</text>

  <line x1="1007" y1="151" x2="1015" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- M1B -->
  <rect x="1016" y="128" width="51" height="46" rx="3"
