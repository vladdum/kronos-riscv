  <!-- FPU dashed connection, re-anchored under EX1/EX2 (midpoint x=889, box bottom y=174) -->
  <line x1="889" y1="174" x2="889" y2="242"
        stroke="#162540" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- FPU block (centered under EX1/EX2 at x=889, w=300) -->
  <rect x="739" y="242" width="300" height="48" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1" stroke-dasharray="7,4"/>
  <text x="889" y="261"
        font-family="'Courier New',monospace"
        font-size="11" letter-spacing="2" fill="#00f0be" text-anchor="middle" opacity="0.65">FPU</text>
  <text x="889" y="280"
        font-family="'Courier New',monospace"
        font-size="11" fill="#243d58" text-anchor="middle">FADD · FMUL · FMA · FDIV · FSQRT</text>

  <!-- Feature bullets -->
  <text x="576" y="336" font-family="'Courier New',monospace" font-size="12" fill="#162540">▸</text>
  <text x="596" y="336" font-family="'Courier New',monospace" font-size="12" fill="#2e4d6a">Full forwarding · bimodal branch predictor + BTB</text>

  <text x="576" y="358" font-family="'Courier New',monospace" font-size="12" fill="#162540">▸</text>
  <text x="596" y="358" font-family="'Courier New',monospace" font-size="12" fill="#2e4d6a">AXI4 native · LR/SC · AMO · NaN-boxing · FCSR</text>

  <text x="576" y="380" font-family="'Courier New',monospace" font-size="12" fill="#162540">▸</text>
  <text x="596" y="380" font-family="'Courier New',monospace" font-size="12" fill="#2e4d6a">CI: Verilator · GCC 15 · riscv-arch-test · Sail</text>

  <line x1="576" y1="406" x2="1240" y2="406" stroke="#0d1928" stroke-width="1"/>

  <!-- ACT4 compliance badges (5 stages) -->
  <!-- s1: x=576, w=120 -->
  <rect x="576" y="422" width="120" height="34" rx="2" fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="580" y="435" font-family="'Courier New',monospace" font-size="10" fill="#00f0be">s1</text>
  <text x="580" y="450" font-family="'Courier New',monospace" font-size="10" fill="#243d58">RV32I · 46/46</text>

  <!-- s2: x=704, w=126 -->
  <rect x="704" y="422" width="126" height="34" rx="2" fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="708" y="435" font-family="'Courier New',monospace" font-size="10" fill="#00f0be">s2</text>
  <text x="708" y="450" font-family="'Courier New',monospace" font-size="10" fill="#243d58">RV32IM · 54/54</text>

  <!-- s3: x=838, w=130 -->
  <rect x="838" y="422" width="130" height="34" rx="2" fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="842" y="435" font-family="'Courier New',monospace" font-size="10" fill="#00f0be">s3</text>
  <text x="842" y="450" font-family="'Courier New',monospace" font-size="10" fill="#243d58">RV32IMC · 81/81</text>

  <!-- s4: x=976, w=138 -->
  <rect x="976" y="422" width="138" height="34" rx="2" fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="980" y="435" font-family="'Courier New',monospace" font-size="10" fill="#00f0be">s4</text>
  <text x="980" y="450" font-family="'Courier New',monospace" font-size="10" fill="#243d58">RV64IMAC · 104/104</text>

  <!-- s5: x=1122, w=148 -->
  <rect x="1122" y="422" width="148" height="34" rx="2" fill="#050e1a" stroke="#162540" stroke-width="1"/>
  <text x="1126" y="435" font-family="'Courier New',monospace" font-size="10" fill="#00f0be">s5</text>
  <text x="1126" y="450" font-family="'Courier New',monospace" font-size="10" fill="#243d58">RV64IMAFDC · 303/303</text>

  <line x1="576" y1="474" x2="1240" y2="474" stroke="#0d1928" stroke-width="1"/>

  <!-- Stage progress (s0–s6) — 7 blocks × 86px, gap 8px, spanning 576–1226 -->
  <rect x="576"  y="488" width="86" height="24" rx="2" fill="#0a1c30" stroke="#00f0be" stroke-width="1" opacity="0.55"/>
  <text x="619"  y="504" font-family="'Courier New',monospace" font-size="11" fill="#00f0be" text-anchor="middle" opacity="0.8">s0</text>

  <rect x="670"  y="488" width="86" height="24" rx="2" fill="#0a1c30" stroke="#00f0be" stroke-width="1" opacity="0.55"/>
  <text x="713"  y="504" font-family="'Courier New',monospace" font-size="11" fill="#00f0be" text-anchor="middle" opacity="0.8">s1</text>

  <rect x="764"  y="488" width="86" height="24" rx="2" fill="#0a1c30" stroke="#00f0be" stroke-width="1" opacity="0.55"/>
  <text x="807"  y="504" font-family="'Courier New',monospace" font-size="11" fill="#00f0be" text-anchor="middle" opacity="0.8">s2</text>

  <rect x="858"  y="488" width="86" height="24" rx="2" fill="#0a1c30" stroke="#00f0be" stroke-width="1" opacity="0.55"/>
  <text x="901"  y="504" font-family="'Courier New',monospace" font-size="11" fill="#00f0be" text-anchor="middle" opacity="0.8">s3</text>

  <rect x="952"  y="488" width="86" height="24" rx="2" fill="#0a1c30" stroke="#00f0be" stroke-width="1" opacity="0.55"/>
  <text x="995"  y="504" font-family="'Courier New',monospace" font-size="11" fill="#00f0be" text-anchor="middle" opacity="0.8">s4</text>

  <rect x="1046" y="488" width="86" height="24" rx="2" fill="#0a1c30" stroke="#00f0be" stroke-width="1" opacity="0.55"/>
  <text x="1089" y="504" font-family="'Courier New',monospace" font-size="11" fill="#00f0be" text-anchor="middle" opacity="0.8">s5–s7</text>

  <!-- s6 planned / OOO (dashed) -->
  <rect x="1140" y="488" width="86" height="24" rx="2" fill="#050e1a" stroke="#162540" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="1183" y="504" font-family="'Courier New',monospace" font-size="11" fill="#1b2f45" text-anchor="middle">s8 OOO</text>

  <!-- ══════════════════════════════════════════
       BOTTOM BAR (full width)
       ══════════════════════════════════════════ -->
  <rect x="0" y="570" width="1280" height="70" fill="#050912"/>
  <line x1="0" y1="570" x2="1280" y2="570" stroke="#0d1928" stroke-width="1"/>

  <text x="72" y="612"
        font-family="'Courier New',monospace"
        font-size="13" fill="#1b2f45">vladdum / kronos-riscv</text>

  <text x="1208" y="612"
        font-family="'Courier New',monospace"
        font-size="13" fill="#1b2f45" text-anchor="end">github.com / vladdum / kronos-riscv</text>
</svg>
