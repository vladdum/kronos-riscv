  <text x="1041.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">M1B</text>

  <line x1="1068" y1="151" x2="1076" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MEM2 -->
  <rect x="1077" y="128" width="51" height="46" rx="3"
        fill="#050e1a" stroke="#162540" stroke-width="1.5"/>
  <text x="1102.5" y="156"
        font-family="'Courier New',monospace"
        font-size="14" font-weight="700" fill="#b8cfe0" text-anchor="middle">MEM2</text>

  <line x1="1129" y1="151" x2="1137" y2="151"
        stroke="#00f0be" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- WB -->
  <rect x="1138" y="128" width="51" height="46" rx="3"
